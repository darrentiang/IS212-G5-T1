name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: cd backend && pytest -v

      - name: Coverage summary
        if: always()
        run: |
          cd backend
          echo "## Pytest coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || echo "no coverage data" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: backend/coverage.xml

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-html
          path: backend/htmlcov/

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: backend/junit.xml

  frontend-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Coverage summary
        if: always()
        run: |
          cd frontend
          echo "## Vitest coverage" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`;
            console.log("| Metric | Coverage |\n|---|---|\n" + ["lines","statements","branches","functions"].map(row).join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY" || echo "no coverage data" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-json
          path: frontend/vitest-report.json

  # The specs are split across four runners. Each shard starts its own
  # backend and frontend through the webServer config, so each seeds its own
  # database; inside a shard the specs still run one at a time (workers: 1).
  functional-shards:
    name: Functional shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functional/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install functional dependencies
        run: cd functional && npm ci

      - name: Read Playwright version
        id: playwright
        run: cd functional && echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Still run on a cache hit: the browser download is skipped, but
      # --with-deps installs the system packages, which are not cached.
      - name: Install Playwright browsers
        run: cd functional && npx playwright install chromium --with-deps

      - name: Run functional tests
        run: cd functional && npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: functional/blob-report/
          retention-days: 1

  # Branch protection requires a check named Functional: this job merges the
  # shards' reports and fails unless every shard passed.
  functional-tests:
    name: Functional
    runs-on: ubuntu-latest
    needs: functional-shards
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functional/package-lock.json

      - name: Install functional dependencies
        run: cd functional && npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: functional/all-blob-reports

      - name: Merge reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/functional-results.json
        run: cd functional && npx playwright merge-reports --reporter=html,json all-blob-reports

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: functional/playwright-report/

      - name: Upload functional results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-json
          path: functional/test-results/functional-results.json

      - name: Fail unless every shard passed
        if: always() && needs.functional-shards.result != 'success'
        run: |
          echo "Functional shards result: ${{ needs.functional-shards.result }}"
          exit 1

  log-to-sheet:
    name: Log to Sheet
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, functional-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy results to expected paths
        run: |
          mkdir -p backend frontend/vitest-report.json functional/test-results
          cp artifacts/pytest-junit/junit.xml backend/junit.xml 2>/dev/null || true
          cp artifacts/vitest-json/vitest-report.json frontend/vitest-report.json 2>/dev/null || true
          cp artifacts/functional-json/functional-results.json functional/test-results/functional-results.json 2>/dev/null || true

      - name: Log results to Google Sheet
        if: env.SHEETS_WEBHOOK_URL != ''
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
        run: |
          node .github/scripts/log-results.js \
            --commit "${{ github.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --webhook "$SHEETS_WEBHOOK_URL"
